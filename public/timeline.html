<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InOut Pilot timeline</title>
<link rel="stylesheet" href="/vendor/bryntum/schedulerpro/fontawesome/css/fontawesome.css">
<link rel="stylesheet" href="/vendor/bryntum/schedulerpro/fontawesome/css/solid.css">
<link rel="stylesheet" href="/vendor/bryntum/schedulerpro/schedulerpro.css">
<link rel="stylesheet" href="/vendor/bryntum/schedulerpro/svalbard-light.css" data-bryntum-theme>
<link rel="stylesheet" href="/bryntum/common.css">
<style>
  #banner { display:none; gap:12px; align-items:center; padding:8px 12px; border:1px solid var(--red);
            background:#fdf1f1; border-radius:8px; margin-bottom:8px; font-size:13px; }
  #banner.on { display:flex; }
  #banner button { padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:#fff; cursor:pointer; font:inherit; color:var(--red); }
  .conflict .b-sch-event { outline: 2px solid var(--red); outline-offset: -2px; }
</style>
</head>
<body>
<header><h1>InOut Pilot <small></small></h1><nav></nav></header>
<main>
  <div id="msg" class="msg"></div>
  <div id="banner"><span id="banner-text"></span><button id="banner-btn">Draft extension</button></div>
  <div class="legend">
    <span><i class="dot" style="background:#534ab7"></i>Invoice sent</span>
    <span><i class="dot" style="background:#0f6e56"></i>Paid</span>
    <span><i class="dot" style="background:#a32d2d"></i>Overdue / failed</span>
    <span><i class="dot" style="background:#f59e0b"></i>Payout waiting for a client</span>
    <span>Drag an invoice bar sideways: its linked payout moves with it.</span>
  </div>
  <div id="view" class="view"></div>
</main>
<script type="module">
import { requireKey, loadAll, post, say, flash, takeFlash, mountNav, esc, money, day, addDays,
         daysBetween, iso, colorOf, invoiceExpected, plannedDate, isConflict } from '/bryntum/common.js';

mountNav('/timeline.html', 'timeline: money in releases money out');

function build(invoices, payments) {
  const invById = new Map(invoices.map((i) => [String(i.id), i]));
  const resources = [];
  const seen = new Set();
  const res = (kind, name) => {
    const id = kind + ':' + String(name || '?').trim().toLowerCase();
    if (!seen.has(id)) { seen.add(id); resources.push({ id, name: String(name || '?') + ' - ' + kind }); }
    return id;
  };

  const events = [];
  for (const i of invoices) {
    const start = day(i.created_at) || invoiceExpected(i);
    const end = invoiceExpected(i);
    if (!start || !end) continue;
    events.push({
      id: 'inv:' + i.id, resourceId: res('client', i.client_name),
      name: i.client_name + ' \u00b7 ' + money(i.amount),
      startDate: start, endDate: end > start ? end : addDays(start, 1),
      eventColor: colorOf(i.status), draggable: i.status !== 'PAID', resizable: false,
    });
  }
  for (const p of payments) {
    const start = plannedDate(p, invById);
    if (!start) continue;
    events.push({
      id: 'pay:' + p.id, resourceId: res('supplier', p.supplier_name),
      name: p.supplier_name + ' \u00b7 ' + money(p.amount),
      startDate: start, endDate: addDays(start, 1),
      eventColor: colorOf(p.status), cls: isConflict(p, invById) ? 'conflict' : '',
      draggable: false, resizable: false,
    });
  }

  const ids = new Set(events.map((e) => e.id));
  const dependencies = [];
  for (const p of payments) {
    const inv = invById.get(String(p.linked_invoice_id));
    if (!inv || !ids.has('inv:' + inv.id) || !ids.has('pay:' + p.id)) continue;
    const expected = invoiceExpected(inv);
    const planned = plannedDate(p, invById);
    if (!expected || !planned) continue;
    dependencies.push({ id: 'dep:' + p.id, from: 'inv:' + inv.id, to: 'pay:' + p.id, type: 2,
                        lag: daysBetween(planned, expected), lagUnit: 'day' });
  }
  return { resources, events, dependencies };
}

function showBanner(invoices, payments) {
  const invById = new Map(invoices.map((i) => [String(i.id), i]));
  const bad = payments.filter((p) => p.status === 'WAITING_FOR_CLIENT' && isConflict(p, invById));
  if (!bad.length) return;
  const p = bad[0];
  const inv = invById.get(String(p.linked_invoice_id));
  const planned = plannedDate(p, invById);
  const due = day(p.due_date);
  const late = planned && due ? daysBetween(planned, due) : 0;
  if (!(late > 0)) return;
  const expected = inv ? invoiceExpected(inv) : null;
  const extra = expected ? daysBetween(planned, expected) : 0;
  const lead = extra > 0 ? (inv ? inv.client_name : p.supplier_name) + ' +' + extra + ' days: ' : '';
  document.getElementById('banner-text').textContent =
    lead + p.supplier_name + ' payout now ' + iso(planned) + ', ' + late +
    ' days after its supplier due date' +
    (bad.length > 1 ? ' (and ' + (bad.length - 1) + ' more)' : '');
  document.getElementById('banner').classList.add('on');
  document.getElementById('banner-btn').onclick = async () => {
    try {
      await post('/payments/' + p.id + '/extension', {});
      flash('Extension drafted for ' + p.supplier_name, 'ok');
      location.reload();
    } catch (e) { say('Could not draft the extension: ' + e.message, 'err'); }
  };
}

async function main() {
  const f = takeFlash();
  if (f) say(f.text, f.cls);
  if (!requireKey()) return;

  let SchedulerPro, data;
  try { ({ SchedulerPro } = await import('/vendor/bryntum/schedulerpro/schedulerpro.module.js')); }
  catch (e) { return say('Could not load Bryntum Scheduler Pro: ' + e.message, 'err'); }
  try { data = await loadAll(); }
  catch (e) { return say('Could not load data: ' + e.message, 'err'); }

  const { resources, events, dependencies } = build(data.invoices, data.payments);
  showBanner(data.invoices, data.payments);

  const times = events.flatMap((e) => [e.startDate.getTime(), e.endDate.getTime()]).concat(Date.now());
  const start = addDays(new Date(Math.min(...times)), -7);
  const end = addDays(new Date(Math.max(...times)), 14);

  const scheduler = new SchedulerPro({
    appendTo: 'view',
    startDate: start, endDate: end,
    visibleDate: { date: new Date(), block: 'center' },
    viewPreset: 'dayAndWeek', rowHeight: 44, barMargin: 6,
    columns: [{ text: 'Payer / Supplier', field: 'name', width: 240 }],
    features: {
      dependencies: true,
      timeRanges: { showCurrentTimeLine: true },
      eventDrag: { constrainDragToResource: true },
      eventResize: false,
    },
    eventRenderer: ({ eventRecord }) => esc(eventRecord.name),
    resources, events, dependencies,
    beforeEventDropFinalize({ context }) {
      const id = String(context.eventRecord.id).replace('inv:', '');
      const moved = iso(context.endDate);
      if (moved === iso(context.eventRecord.endDate)) { context.finalize(false); return; }
      context.async = true;
      (async () => {
        try {
          await post('/api/invoices/' + encodeURIComponent(id) + '/shift', { expected_pay_date: moved });
          flash('Expected pay date moved to ' + moved + '. Payouts waiting on this invoice moved too.', 'ok');
          location.reload();
        } catch (e) {
          say('Could not move the invoice: ' + e.message, 'err');
          context.finalize(false);
        }
      })();
    },
  });
  scheduler.scrollToDate(new Date(), { block: 'center' });
  say('');
}
main();
</script>
</body>
</html>
