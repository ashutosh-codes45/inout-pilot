.s{font:400 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;text-anchor:middle;dominant-baseline:central}
.l{font:400 12px -apple-system,Segoe UI,Helvetica,Arial,sans-serif;dominant-baseline:central}
</style>
