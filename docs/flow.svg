<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="890" viewBox="0 0 1040 890" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>InOut Pilot flow: collect, hold, and pay with a cash-flow guardian</title>
<desc>A merchant request goes to an AI agent. The receiving branch creates and sends PayPal invoices, a daily scheduler uses payer scores to decide reminders, and the paid webhook marks invoices paid. The paying branch takes payout requests; linked payouts wait for the client payment and a three-case check decides whether to keep waiting, alert the merchant, or release to the policy check (auto-pay, ask first or block). Everything is stored in a database that feeds an AG Grid dashboard and a Bryntum timeline.</desc>
